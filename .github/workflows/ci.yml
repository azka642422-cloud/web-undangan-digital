name: CI

on:
  pull_request:
  push:
    branches: [hardening-production]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aksara
          POSTGRES_PASSWORD: aksara_ci
          POSTGRES_DB: aksara_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U aksara -d aksara_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://aksara:aksara_ci@localhost:5432/aksara_ci
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run build
